# This is a basic workflow to help you get started with Actions

name: build-server-v1

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
    - develop
    - master
    - main
    paths: # Only run on code change
    - "**.py"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "dist"
  release-new-version:
    # The type of runner that the job will run on
    runs-on: windows-2019

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pyinstaller==6.11.1 pyinstaller-hooks-contrib==2025.1

      - name: Get Release Version
        id: release_version
        run: echo "::set-output name=server_version::n$(date +%d%m%y)"
            
      - name: Build Server
        run: pyinstaller --onefile src/server.py
        
      - name: Create PreRelease
        id: make_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_VERSION: ${{ steps.release_version.outputs.server_version }}
        with:
          tag_name: ${{ env.SERVER_VERSION }}
          release_name: Server ${{ env.SERVER_VERSION }}
          draft: false
          prerelease: false

      - name: Create Package
        shell: powershell
        run: |
            Compress-Archive -Path "./dist/server.exe", "./env" -DestinationPath "./dist/${{ steps.release_version.outputs.server_version }}.zip"
          
      - name: Upload Server Binaries
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_VERSION: ${{ steps.release_version.outputs.server_version }}
        with:
          upload_url: ${{ steps.make_release.outputs.upload_url }}
          asset_path: ./dist/${{ env.SERVER_VERSION }}.zip
          asset_name: server_${{ env.SERVER_VERSION }}.zip
          asset_content_type: application/zip
